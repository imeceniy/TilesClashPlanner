<VirtualHost *:80>
    ServerName test.imeceniy.site
    DocumentRoot /srv/www/test.imeceniy.site/public_html/

    <Directory /srv/www/test.imeceniy.site/public_html/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /srv/www/test.imeceniy.site/logs/error.log
    CustomLog /srv/www/test.imeceniy.site/logs/access.log combined
    SetEnv WPCONFIG_ENVNAME staging
</VirtualHost>
