server {
    listen 80;
    listen [::]:80;
    server_name biohimltd.ru www.biohimltd.ru;

    return 301 https://biohimltd.ru$request_uri;
}

server {
    listen 127.0.0.1:9443 ssl http2;
    server_name biohimltd.ru www.biohimltd.ru;

    root /var/www/biohimltd.ru/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/biohimltd.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biohimltd.ru/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /components {
        return 301 /components/;
    }

    location /components/ {
        auth_basic "Market Parser";
        auth_basic_user_file /etc/nginx/.htpasswd-market-parser;

        client_max_body_size 25m;
        limit_req zone=market_parser burst=3 nodelay;

        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'self'; base-uri 'none'" always;
    }

    location /api/ {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location = /TilesClashPlanner {
        return 301 /TilesClashPlanner/;
    }

    location /TilesClashPlanner/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
